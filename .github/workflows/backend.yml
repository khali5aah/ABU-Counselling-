name: backend

on:
  pull_request:
    paths:
      - backend/**
  push:
    branches:
      - main
    paths:
      - backend/**

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: crownbird
          POSTGRES_USER: crownbird
          POSTGRES_PASSWORD: crownbird
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U crownbird -d crownbird"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Check migrations
        run: |
          cd backend
          DJANGO_SECRET_KEY=ci DJANGO_DEBUG=true DJANGO_ALLOWED_HOSTS=localhost,testserver POSTGRES_HOST=localhost OTP_PROVIDER=console python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: |
          cd backend
          DJANGO_SECRET_KEY=ci DJANGO_DEBUG=true DJANGO_ALLOWED_HOSTS=localhost,testserver POSTGRES_HOST=localhost OTP_PROVIDER=console pytest
